<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#238b35" />
    <script>
      // Anti-FOUC: aplica el tema antes del primer paint para evitar un flash
      // de tema claro en usuarios con preferencia oscura.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark = t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
      // Carga no bloqueante de fuentes: cuando el CSS termine de descargar se
      // cambia media a 'all'. Equivalente al hack onload inline pero con
      // addEventListener (CSP: script-src-attr 'none' en producción, sin
      // 'unsafe-inline').
      (function () {
        var f = document.getElementById("fonts-css");
        if (f) f.addEventListener("load", function () { f.media = "all"; });
      })();
    </script>
    <title>Red Solidaria San Ramón — Cuando alguien necesita ayuda, la comunidad responde</title>
    <meta name="description" content="Red de personas que se unen para ayudar a familias, niños y animales de San Ramón, Chanchamayo. Dona, hazte voluntario o pide ayuda: la comunidad responde." />
    <meta name="keywords" content="Red Solidaria, San Ramón, Chanchamayo, Junín, Perú, donaciones, voluntariado, adopciones, ONG, solidaridad, ayuda" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="Spanish" />
    <meta name="author" content="Red Solidaria San Ramón" />

    <!-- Open Graph defaults -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Red Solidaria San Ramón" />
    <meta property="og:title" content="Red Solidaria San Ramón — Cuando alguien necesita ayuda, la comunidad responde" />
    <meta property="og:description" content="Red de personas que se unen para ayudar a familias, niños y animales de San Ramón, Chanchamayo. Dona, hazte voluntario o pide ayuda." />
    <meta property="og:locale" content="es_PE" />

    <!-- Twitter Card defaults -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Red Solidaria San Ramón" />
    <meta name="twitter:description" content="Red de personas que se unen para ayudar a familias, niños y animales de San Ramón, Chanchamayo." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts: preconnect + descarga no bloqueante (antes el @import en el CSS
         retrasaba la descarga hasta después de bajar el bundle principal) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    />
    <link
      id="fonts-css"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      media="print"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" />
    </noscript>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "NGO",
      "name": "Red Solidaria San Ramón",
      "alternateName": "Red Solidaria",
      "description": "Organización solidaria sin fines de lucro en San Ramón, Chanchamayo, Perú. Apoyamos campañas sociales, protección animal y bienestar comunitario.",
      "url": "https://redsolidariasanramon.org",
      "telephone": "+51 921 615 737",
      "email": "contacto@redsolidariasanramon.org",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Jr. Los Álamos 245",
        "addressLocality": "San Ramón",
        "addressRegion": "Junín",
        "addressCountry": "PE"
      },
      "areaServed": {
        "@type": "Place",
        "name": "San Ramón, Chanchamayo, Junín, Perú"
      },
      "sameAs": [
        "https://facebook.com/redsolidariasanramon",
        "https://instagram.com/redsolidariasanramon"
      ],
      "foundingDate": "2018",
      "knowsAbout": ["donaciones", "voluntariado", "adopción animal", "bienestar comunitario", "casos sociales"]
    }
    </script>

    <style>
      /* Skeleton de la portada: se ve al instante (sin JS) mientras descarga
         React; createRoot().render lo reemplaza al montar.
         Nueva composición editorial: texto a la izquierda, foto a la derecha,
         sobre fondo crema (#fafcf8). */
      #hero-skeleton {
        min-height: 100vh;
        display: flex;
        align-items: center;
        background: #fafcf8;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #17201a;
        animation: hero-fade 0.6s ease-out;
      }
      #hero-skeleton .shell {
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
        padding: 7rem 1.5rem 3rem;
        display: grid;
        grid-template-columns: 1fr;
        gap: 2.5rem;
        align-items: center;
      }
      #hero-skeleton .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: rgba(35, 139, 53, 0.1);
        color: #238b35;
        font-weight: 600;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.45rem 1rem;
        border-radius: 9999px;
      }
      #hero-skeleton h1 {
        font-size: clamp(2.6rem, 6vw, 4rem);
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.02em;
        margin: 1.25rem 0 0;
        color: #17201a;
      }
      #hero-skeleton h1 span { color: #238b35; display: block; }
      #hero-skeleton .lead {
        font-size: clamp(1.15rem, 2.4vw, 1.45rem);
        font-weight: 600;
        color: #17201a;
        margin: 1.25rem 0 0;
      }
      #hero-skeleton p.intro {
        max-width: 34rem;
        color: #66736a;
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.6;
        margin: 0.75rem 0 0;
      }
      #hero-skeleton .ctas {
        display: flex;
        gap: 0.85rem;
        margin-top: 1.75rem;
        flex-wrap: wrap;
      }
      #hero-skeleton .ctas span {
        padding: 0.95rem 1.9rem;
        border-radius: 0.75rem;
        font-weight: 600;
        font-size: 1rem;
      }
      #hero-skeleton .ctas .primary { background: #238b35; color: #fff; }
      #hero-skeleton .ctas .ghost { background: #fff; border: 1px solid rgba(18, 59, 36, 0.25); color: #123b24; }
      #hero-skeleton .photo {
        position: relative;
        aspect-ratio: 4 / 3;
        border-radius: 1.5rem;
        overflow: hidden;
        background: linear-gradient(135deg, #d9f0dd, #bcdcc4 60%, #a8cfb2);
        box-shadow: 0 24px 50px -12px rgba(18, 59, 36, 0.25);
        border: 1px solid rgba(18, 59, 36, 0.08);
      }
      #hero-skeleton .photo::after {
        content: "…";
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: rgba(18, 59, 36, 0.35);
      }
      #hero-skeleton .caption {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-top: 0.75rem;
        color: #66736a;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #hero-skeleton .caption::after {
        content: "";
        height: 1px;
        flex: 1;
        background: #e3eae4;
      }
      @media (min-width: 1024px) {
        #hero-skeleton .shell {
          grid-template-columns: 1fr 1fr;
        }
      }
      @keyframes hero-fade {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="hero-skeleton">
        <div class="shell">
          <div>
            <div class="badge">San Ramón · Chanchamayo · Selva Central</div>
            <h1>Red Solidaria<span>San Ramón</span></h1>
            <p class="lead">Cuando alguien necesita ayuda, la comunidad responde.</p>
            <p class="intro">Una red de personas que se unen para ayudar a familias, niños y animales de nuestra comunidad.</p>
            <div class="ctas">
              <span class="primary">Quiero ayudar</span>
              <span class="ghost">Necesito ayuda</span>
            </div>
          </div>
          <div>
            <div class="photo" aria-hidden="true"></div>
            <div class="caption">La red en acción · San Ramón, Chanchamayo</div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
