# Actualizaciones automáticas de dependencias (shareish tiene deps con CVEs
# conocidos: Django 3.2 EOL, torch 1.13, node-sass 4). Dependabot abre PRs
# semanales; el nuevo CI los valida automáticamente.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
