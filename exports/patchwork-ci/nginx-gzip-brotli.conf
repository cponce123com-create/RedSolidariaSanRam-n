# Fragmento para docker/nginx/patchwork-web.conf
# Compresión gzip/brotli: hoy tus assets hasheados viajan crudos (~-15-20% con
# brotli, ~-60% el JSON del API si se proxya por este nginx).
#
# gzip: módulo estándar de nginx (sin dependencias extra).
# brotli: requiere el módulo ngx_brotli (p. ej. imagen base
# `fholzer/nginx-brotli` o compilar el módulo en tu Dockerfile de nginx).
#
# Pegar dentro del bloque `http {}` (o server {}, si solo aplica al web):

    # gzip estándar (JSON del API + HTML)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/javascript
        text/css
        text/html
        text/plain
        image/svg+xml
        application/manifest+json;

    # brotli (si el módulo está disponible; nginx sirve br antes que gzip)
    brotli on;
    brotli_comp_level 5;
    brotli_static on; # sirve .br pre-generados (se generan en el build con el plugin de Vite)
    brotli_types
        application/json
        application/javascript
        text/css
        text/html
        text/plain
        image/svg+xml
        application/manifest+json;

# Nota: tus assets ya tienen `Cache-Control: public, immutable` — con
# `brotli_static on` + pre-compresión en el build (vite-plugin-compression2),
# nginx sirve el .br sin comprimir en cada request.
