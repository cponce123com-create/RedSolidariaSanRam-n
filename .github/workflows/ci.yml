name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Auditoría Lighthouse manual: permite apuntar a un preview de Render
  # específico de un PR. Sin input usa la URL de producción.
  workflow_dispatch:
    inputs:
      url:
        description: "URL a auditar con Lighthouse (default: producción)"
        required: false
        default: "https://redsolidariasanramon.org"

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # La preinstall del root exige pnpm (valida $npm_config_user_agent)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # typecheck:libs compila los paquetes TS (d.ts de lib/db y lib/api-zod)
      # antes del typecheck de los artifacts, en orden de dependencias.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm -r --if-present test

      # Dependencias: auditoría de vulnerabilidades (falla el job ante CVEs).
      - name: Audit de dependencias
        run: pnpm audit --prod

      # Build de producción (vite build de la web + build.mjs del API) para
      # detectar errores de compilación específicos de prod antes de Render.
      - name: Build
        run: pnpm -r --if-present run build

  # Auditoría de accesibilidad/rendimiento/SEO con Lighthouse (treosh/lhci).
  # Es informativa: continue-on-error evita que bloquee deploy o merge de PRs.
  # En push a main audita producción; con workflow_dispatch se puede apuntar
  # a un preview de Render. Umbrales y reporte en ./lighthouserc.json.
  lighthouse-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Lighthouse CI Action
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ inputs.url || 'https://redsolidariasanramon.org' }}
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
