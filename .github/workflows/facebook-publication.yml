name: Facebook publication integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres-outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: facebook_outbox_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build test modules and verify transactional Facebook outbox
        working-directory: artifacts/api-server
        env:
          FACEBOOK_OUTBOX_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/facebook_outbox_test
        run: node build-tests.mjs && node --test tests/facebook-postgres.test.mjs
