name: Notifications and web verification
on:
  pull_request:
  push:
    branches: ['android-native/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notifications_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Test notification transactions and public feed
        run: node --test lib/db/tests/notifications.integration.mjs
        env:
          NOTIFICATIONS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/notifications_test
      - name: Test web and API
        run: pnpm -r --if-present test
      - name: Build web and API
        run: pnpm run build
