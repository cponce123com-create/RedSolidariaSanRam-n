openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Red Solidaria San Ramón API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: campaigns
  - name: donations
  - name: campaign-updates
  - name: campaign-images
  - name: news
  - name: testimonials
  - name: stats
  - name: contact
  - name: volunteers
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /campaigns:
    get:
      operationId: getCampaigns
      tags: [campaigns]
      summary: List all campaigns
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, completed, paused, all]
        - name: featured
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a campaign (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignInput"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{id}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get campaign by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
    put:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update campaign (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignInput"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete campaign (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /campaigns/{id}/donations:
    get:
      operationId: getCampaignDonations
      tags: [donations]
      summary: Get donations for a specific campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of donations for campaign
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Donation"

  /campaigns/{id}/donors:
    get:
      operationId: getCampaignDonors
      tags: [donations]
      summary: Public list of approved donors for a campaign (no PII)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of approved donors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignDonor"

  /campaigns/{id}/updates:
    get:
      operationId: getCampaignUpdates
      tags: [campaign-updates]
      summary: Get updates for a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of updates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignUpdate"
    post:
      operationId: createCampaignUpdate
      tags: [campaign-updates]
      summary: Add an update to a campaign (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignUpdateInput"
      responses:
        "201":
          description: Created update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignUpdate"

  /campaigns/{id}/updates/{updateId}:
    delete:
      operationId: deleteCampaignUpdate
      tags: [campaign-updates]
      summary: Delete a campaign update (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: updateId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /campaigns/{id}/images:
    get:
      operationId: getCampaignImages
      tags: [campaign-images]
      summary: Get gallery images for a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignImage"
    post:
      operationId: addCampaignImage
      tags: [campaign-images]
      summary: Add image to campaign gallery (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignImageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignImage"

  /campaigns/{id}/images/{imageId}:
    delete:
      operationId: deleteCampaignImage
      tags: [campaign-images]
      summary: Delete campaign gallery image (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /donations:
    post:
      operationId: createDonation
      tags: [donations]
      summary: Submit a donation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDonationInput"
      responses:
        "201":
          description: Donation submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donation"
    get:
      operationId: getDonations
      tags: [donations]
      summary: List all donations (admin)
      parameters:
        - name: campaignId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: List of donations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Donation"

  /donations/{id}:
    get:
      operationId: getDonation
      tags: [donations]
      summary: Get donation by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Donation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donation"
    put:
      operationId: updateDonationStatus
      tags: [donations]
      summary: Update donation status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDonationStatusInput"
      responses:
        "200":
          description: Updated donation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donation"

  /donations/{id}/proofs:
    get:
      operationId: getDonationProofs
      tags: [donations]
      summary: List proof images for a donation (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of proofs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DonationProof"
    post:
      operationId: addDonationProof
      tags: [donations]
      summary: Add a manual proof image to a donation (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                imageUrl:
                  type: string
                publicId:
                  type: string
                  nullable: true
                mimeType:
                  type: string
                  nullable: true
              required: [imageUrl]
      responses:
        "201":
          description: Proof added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationProof"

  /donations/{id}/proofs/{proofId}:
    delete:
      operationId: deleteDonationProof
      tags: [donations]
      summary: Delete a proof image (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: proofId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /donations/stats:
    get:
      operationId: getDonationStats
      tags: [donations]
      summary: Get overall donation statistics
      responses:
        "200":
          description: Donation statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationStats"

  /uploads/signature:
    post:
      operationId: getUploadSignature
      tags: [uploads]
      summary: Get a signed upload URL for donation proofs (public, rate limited)
      responses:
        "200":
          description: Upload signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSignature"

  /uploads/admin-signature:
    post:
      operationId: getAdminUploadSignature
      tags: [uploads]
      summary: Get a signed upload URL for campaign evidence (admin)
      responses:
        "200":
          description: Upload signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSignature"

  /news:
    get:
      operationId: getNews
      tags: [news]
      summary: List news posts
      responses:
        "200":
          description: List of news
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsPost"
    post:
      operationId: createNews
      tags: [news]
      summary: Create news post (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNewsInput"
      responses:
        "201":
          description: Created news post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsPost"

  /news/{id}:
    get:
      operationId: getNewsPost
      tags: [news]
      summary: Get news post by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: News post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsPost"
    put:
      operationId: updateNews
      tags: [news]
      summary: Update news post (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNewsInput"
      responses:
        "200":
          description: Updated news post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsPost"
    delete:
      operationId: deleteNews
      tags: [news]
      summary: Delete news post (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /testimonials:
    get:
      operationId: getTestimonials
      tags: [testimonials]
      summary: List testimonials
      responses:
        "200":
          description: List of testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimonial"
    post:
      operationId: createTestimonial
      tags: [testimonials]
      summary: Create testimonial (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestimonialInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Testimonial"

  /testimonials/{id}:
    put:
      operationId: updateTestimonial
      tags: [testimonials]
      summary: Update testimonial (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestimonialInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Testimonial"
    delete:
      operationId: deleteTestimonial
      tags: [testimonials]
      summary: Delete testimonial (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get impact statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactStats"
    put:
      operationId: updateStats
      tags: [stats]
      summary: Update stats (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpactStats"
      responses:
        "200":
          description: Updated stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactStats"

  /contact:
    post:
      operationId: sendContactMessage
      tags: [contact]
      summary: Send contact message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessage"

  /contact/messages:
    get:
      operationId: getContactMessages
      tags: [contact]
      summary: List contact messages (admin)
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactMessage"

  /volunteers:
    post:
      operationId: registerVolunteer
      tags: [volunteers]
      summary: Register as volunteer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volunteer"
    get:
      operationId: getVolunteers
      tags: [volunteers]
      summary: List volunteers (admin)
      responses:
        "200":
          description: List of volunteers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Volunteer"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Get current admin session
      responses:
        "200":
          description: Admin info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Campaign:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
          nullable: true
        goal:
          type: number
        raised:
          type: number
        donorCount:
          type: integer
        status:
          type: string
          enum: [active, completed, paused]
        featured:
          type: boolean
        category:
          type: string
        startDate:
          type: string
        endDate:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - title
        - description
        - goal
        - raised
        - donorCount
        - status
        - featured
        - category
        - startDate
        - createdAt

    CreateCampaignInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
          nullable: true
        goal:
          type: number
        raised:
          type: number
        status:
          type: string
          enum: [active, completed, paused]
        featured:
          type: boolean
        category:
          type: string
        startDate:
          type: string
        endDate:
          type: string
          nullable: true
      required:
        - title
        - description
        - goal
        - status
        - featured
        - category
        - startDate

    CampaignUpdate:
      type: object
      properties:
        id:
          type: integer
        campaignId:
          type: integer
        title:
          type: string
        content:
          type: string
        createdAt:
          type: string
      required: [id, campaignId, title, content, createdAt]

    CreateCampaignUpdateInput:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
      required: [title, content]

    CampaignImage:
      type: object
      properties:
        id:
          type: integer
        campaignId:
          type: integer
        imageUrl:
          type: string
        caption:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, campaignId, imageUrl, createdAt]

    CreateCampaignImageInput:
      type: object
      properties:
        imageUrl:
          type: string
        caption:
          type: string
          nullable: true
      required: [imageUrl]

    Donation:
      type: object
      properties:
        id:
          type: integer
        campaignId:
          type: integer
          nullable: true
        campaignTitle:
          type: string
          nullable: true
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        amount:
          type: number
        paymentMethod:
          type: string
        message:
          type: string
          nullable: true
        anonymous:
          type: boolean
        publicProof:
          type: boolean
        receiptUrl:
          type: string
          nullable: true
        receiptNote:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, approved, rejected]
        adminNote:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - firstName
        - lastName
        - email
        - amount
        - paymentMethod
        - anonymous
        - status
        - createdAt

    CreateDonationInput:
      type: object
      properties:
        campaignId:
          type: integer
          nullable: true
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        amount:
          type: number
        paymentMethod:
          type: string
          enum: [yape, plin, transfer, card, cash, other]
        message:
          type: string
          nullable: true
        anonymous:
          type: boolean
        publicProof:
          type: boolean
        receiptUrl:
          type: string
          nullable: true
        receiptNote:
          type: string
          nullable: true
        proofImageUrl:
          type: string
          nullable: true
        proofPublicId:
          type: string
          nullable: true
        proofMimeType:
          type: string
          nullable: true
      required:
        - firstName
        - lastName
        - email
        - amount
        - paymentMethod
        - anonymous

    CampaignDonor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
        amount:
          type: number
        message:
          type: string
          nullable: true
        date:
          type: string
        publicProof:
          type: boolean
        proofUrl:
          type: string
          nullable: true
      required:
        - id
        - amount
        - date
        - publicProof

    DonationProof:
      type: object
      properties:
        id:
          type: integer
        donationId:
          type: integer
        imageUrl:
          type: string
        publicId:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - donationId
        - imageUrl
        - createdAt

    UploadSignature:
      type: object
      properties:
        cloudName:
          type: string
        apiKey:
          type: string
        timestamp:
          type: string
        publicId:
          type: string
        folder:
          type: string
        signature:
          type: string
      required:
        - cloudName
        - apiKey
        - timestamp
        - publicId
        - folder
        - signature

    UpdateDonationStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
        adminNote:
          type: string
          nullable: true
      required: [status]

    DonationStats:
      type: object
      properties:
        totalDonations:
          type: integer
        totalAmount:
          type: number
        pendingCount:
          type: integer
        approvedCount:
          type: integer
        totalDonors:
          type: integer
      required:
        - totalDonations
        - totalAmount
        - pendingCount
        - approvedCount
        - totalDonors

    NewsPost:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        summary:
          type: string
        imageUrl:
          type: string
          nullable: true
        publishedAt:
          type: string
        createdAt:
          type: string
      required: [id, title, content, summary, publishedAt, createdAt]

    CreateNewsInput:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        summary:
          type: string
        imageUrl:
          type: string
          nullable: true
        publishedAt:
          type: string
      required: [title, content, summary, publishedAt]

    Testimonial:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        message:
          type: string
        avatarUrl:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, name, role, message, createdAt]

    CreateTestimonialInput:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
        message:
          type: string
        avatarUrl:
          type: string
          nullable: true
